name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish libadwaita-1-dev libgtk-4-dev zsh \
            xvfb xauth xdotool imagemagick dbus-x11 python3 \
            zsh-autosuggestions zsh-syntax-highlighting tmux neovim weston \
            fonts-dejavu-core fonts-liberation libgl1-mesa-dri

      - name: Fingerprint CPU features for native Zig objects
        id: cpu
        run: echo "features=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.features }}

      - name: Check formatting and release metadata
        run: |
          cargo fmt --check
          scripts/check-release-metadata.sh
          scripts/update-ghostty.sh --check

      - name: Test
        env:
          CHELOTYPE_REQUIRE_E2E: "1"
          GSK_RENDERER: cairo
        run: scripts/with-zig.sh cargo test --locked -- --nocapture --test-threads=1

      - name: Check Flatpak release linkage
        run: scripts/with-zig.sh cargo build --release --locked --features libghostty-vt/link-dynamic

      - name: Lint
        run: scripts/with-zig.sh cargo clippy --all-targets --locked -- -D warnings
