repos:
- repo: local
  hooks:
  - id: cargo-fmt
    name: cargo fmt
    entry: bash scripts/with-zig.sh cargo fmt -- --check
    language: system
    pass_filenames: false
  - id: cargo-clippy
    name: cargo clippy
    entry: bash scripts/with-zig.sh cargo clippy --all-targets -- -D warnings
    language: system
    pass_filenames: false
  - id: cargo-test
    name: cargo test
    entry: bash scripts/with-zig.sh cargo test -- --test-threads=1
    language: system
    pass_filenames: false
