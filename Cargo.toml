[package]
name = "chelotype"
version = "0.1.15"
edition = "2024"
description = "Opinionated GTK terminal"
repository = "https://github.com/chelokot/Chelotype"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "gtk", "containers", "pty", "shell"]
categories = ["command-line-utilities"]

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.10", package = "gtk4", features = ["v4_6"] }
libc = "0.2"
portable-pty = "0.9"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
libghostty-vt = { version = "0.2.0", default-features = false }
unicode-width = "0.2"

[dev-dependencies]
serial_test = "3.1"
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false
