[package]
name = "chelotype"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.8", package = "libadwaita" }
gtk = { version = "0.10", package = "gtk4" }
portable-pty = "0.9"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
libghostty-vt = "0.1.1"
unicode-width = "0.2"

[dev-dependencies]
serial_test = "3.1"
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false
