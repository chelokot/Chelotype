[package]
name = "chelotype"
version = "0.1.0"
edition = "2024"

[features]
legacy-vte-bridge = ["dep:vte", "dep:regex"]

[dependencies]
adw = { version = "0.8", package = "libadwaita" }
gtk = { version = "0.10", package = "gtk4" }
vte = { version = "0.9", package = "vte4", features = ["v0_72"], optional = true }
regex = { version = "1.11", optional = true }
portable-pty = "0.9"
alacritty_terminal = { version = "0.25", default-features = false, features = ["serde"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serial_test = "3.1"
criterion = "0.5"

[[bench]]
name = "perf"
harness = false
required-features = ["legacy-vte-bridge"]

[[bench]]
name = "pipeline"
harness = false
