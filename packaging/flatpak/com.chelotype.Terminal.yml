app-id: com.chelotype.Terminal
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: chelotype
finish-args:
  - --allow=devel
  - --device=dri
  - --filesystem=host
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /bin/zig
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/zig-0.15.2
  - /share/cmake
  - /share/doc
  - /share/licenses/com.chelotype.Terminal/zig
  - /share/man
  - /share/pkgconfig
  - "*.a"
  - "*.la"
modules:
  - name: zig
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/zig-0.15.2 /app/bin
      - cp -a . /app/lib/zig-0.15.2
      - ln -s /app/lib/zig-0.15.2/zig /app/bin/zig
    sources:
      - type: archive
        url: https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
        sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        strip-components: 1
        only-arches:
          - x86_64

  - name: chelotype
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/chelotype/cargo
        GHOSTTY_SOURCE_DIR: /run/build/chelotype/ghostty-src
        ZIG_GLOBAL_CACHE_DIR: /run/build/chelotype/zig-cache
        PATH: /usr/lib/sdk/rust-stable/bin:/app/bin:/usr/bin
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/chelotype /app/bin/chelotype
      - install -Dm755 "$(find target/release/build/libghostty-vt-sys-*/out/ghostty-install/lib -name libghostty-vt.so.0.1.0 -print -quit)" /app/lib/libghostty-vt.so.0.1.0
      - ln -sf libghostty-vt.so.0.1.0 /app/lib/libghostty-vt.so.0
      - ln -sf libghostty-vt.so.0 /app/lib/libghostty-vt.so
      - install -Dm644 ghostty-src/LICENSE /app/share/licenses/com.chelotype.Terminal/ghostty/LICENSE
      - PREFIX=/app scripts/install-desktop-metadata.sh
    sources:
      - cargo-sources.json
      - zig-sources.json
      - type: archive
        archive-type: tar-gzip
        url: https://codeload.github.com/ghostty-org/ghostty/tar.gz/bebca84668947bfc92b9a30ed58712e1c34eee1d
        sha256: 91035e9deb5b66e905307101ac763fb47d2aded15dda71fcee463bf1e3e7766e
        dest: ghostty-src
        strip-components: 1
      - type: dir
        path: ../..
        skip:
          - .git
          - .tools
          - target
          - cargo-sources.tmp.json
